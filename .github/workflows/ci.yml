name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The pinned reusable workflow declares `packages: write` (GHCR push on main).
# A called workflow can never exceed the caller's token permissions, and this
# org's default GITHUB_TOKEN is read-only — without this block every run dies
# as a startup_failure ("requesting 'packages: write', but is only allowed
# 'packages: read'").
permissions:
  contents: read
  packages: write

jobs:
  frontend-ci:
    uses: RexiAI/my-engineering-standards/.github/workflows/ci-nextjs.yml@249934e1b62c98429c602d0b3cdad48755e14bf8 # pinned; bump deliberately, never track a branch
    with:
      docker-registry: ghcr.io
    secrets:
       GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
